name: Package Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QINGJIAN_UIACCESS: '0'
      CARGO_TERM_COLOR: always
      PYTHON: python
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.96.0
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Fetch product data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/generated/dicts data/models/hanzhang-zhiwei data/models/hanzhang-tongbian

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安装程序 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Build Windows installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingjian-windows-setup
          path: target/installer/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v0.1.3-clipboard"
          # 如果已有该标签的 release 则更新附件，否则创建
          gh release create "$TAG_NAME" target/installer/*.exe \
            --title "青简输入法（局域网共享剪贴板版）$TAG_NAME" \
            --notes "基于 qingjian 二次开发，新增局域网共享剪贴板功能。
            
功能亮点：
- 局域网设备 UDP 广播自动发现
- ChaCha20-Poly1305 端到端对称加密传输
- 哈希环形队列与 TTL 回声风暴抑制
- WinUI 3 原生设置面板（开关联动、口令配置、对端发现列表）
- CLI 命令行工具测试支持 (qingjian-cli clipboard)

包含全套 Windows 64位服务端、64/32位 TSF 输入法驱动、WinUI 3 独立设置程序与离线词库模型。" \
            --clobber || true
